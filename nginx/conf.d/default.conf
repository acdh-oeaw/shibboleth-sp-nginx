server {
    listen 80;
    server_name _;

    # Internal FastCGI authorizer endpoint (used by shib_request)
    location = /shibauthorizer {
        internal;
        include shib_fastcgi_params;
        fastcgi_pass unix:/run/shibboleth/shibauthorizer.sock;
    }

    # Shibboleth responder (SSO endpoints: /Shibboleth.sso/*)
    location /Shibboleth.sso {
        include shib_fastcgi_params;
        fastcgi_pass unix:/run/shibboleth/shibresponder.sock;
    }

    # Protected location -- adapt this to your application
    location /secure {
        shib_request /shibauthorizer;
        shib_request_use_headers on;
        include shib_clear_headers;

        # Proxy to your application, e.g.:
        # proxy_pass http://app:8000;
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
